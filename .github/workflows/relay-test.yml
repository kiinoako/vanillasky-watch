name: relay-test

# 临时文件：验证 GITHUB_TOKEN 触发的 workflow_dispatch 在本仓库能产生新 run。验证完就删。
on:
  workflow_dispatch:
    inputs:
      hop:
        type: string
        default: '1'

jobs:
  hop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOP: ${{ inputs.hop }}
        run: |
          echo "hop $HOP"
          if [ "$HOP" = "1" ]; then gh workflow run relay-test.yml --ref "${{ github.ref_name }}" -f hop=2; fi
