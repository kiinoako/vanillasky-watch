name: Vanilla Sky 放票监测

# 云端是兜底，不是主力 —— 主力是本机那份（常态 150 秒一轮，外加一个每 10 分钟
# 检查一次的看门狗）。这里只负责「家里断电断网、电脑关机时别全盘错过」。
#
# ------------------------------------------------------------------------------
# 2026-08-23 重做：密度交给 job 自己控制，cron 只负责把 job 拉起来
# ------------------------------------------------------------------------------
# 原来的设计是「查一轮就退出」，靠 cron 控制密度：
#     密档 */15 5-15（格鲁吉亚白天）+ 疏档每小时 = 57 次/天
#
# 实测根本没兑现。查了 8/21-8/23 的全部 run：
#     8/22 触发 19 次，8/23 到傍晚 8 次，密档那条 */15 被整条压成约一小时一次，
#     最大空档 224 分钟（8/23 00:00-03:31 UTC 什么都没跑）。
# 这是 GitHub 对 public repo 的 schedule 的既有行为：best-effort，
# 高频 cron 会被直接丢弃。**不能指望 cron 给你 15 分钟一次。**
#
# 所以现在：
#   · cron 写成 */15 * * * *，只是尽量多给 GitHub 几次「可以拉起我」的机会；
#     它实际会给多少次不重要，能给到就行。
#   · 真正的密度由 watch-once.ps1 在 job 内部循环控制 ——
#     一次触发跑 35 分钟，格鲁吉亚白天每 5 分钟查一轮、夜里每 15 分钟一轮。
#     实测一轮约 60 秒，所以白天一次触发大概查 6 轮。
#   · concurrency 用 cancel-in-progress: false：跑着的时候新触发排队而不是打断，
#     上一次跑完排队那次立刻接上。
#     （GitHub 只保留一个 pending，多余的自动作废，不会堆积。）
#
# 【为什么是 35 分钟】
#   一开始定的 20，理由是「本机才是主力，现在有看门狗盯着，云端只要兜个底」。
#   这个理由后来被推翻了 —— 8/24 查清楚，本机停摆的主要原因根本不是进程出问题，
#   是**机器进 S0 新式待机**（8/21 那次连着待机两天，8/23 夜里又待机 13 小时）。
#   待机期间看门狗跟监测一起被挂起，任务调度器都不计时，它一点忙都帮不上。
#   也就是说：本机合盖睡着的那十几个小时里，云端是唯一还在监测的东西。
#
#   所以云端不是「兜底」那么轻，往上加。35 是折中：
#     · 每小时覆盖一半多（实测每次 run 约 31-33 分钟）
#     · runner 占用比拉满 50 少三成
#   真到开卖窗口最吃紧的几天，可以再上调，50/55 是这个方案的上限。
#   （public repo 的 Actions 分钟数不限量，所以这个取舍是「占多少别人的资源」，
#     不是「花多少钱」。）

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:              # 手动触发，用来做验证
    inputs:
      test_push:
        description: '只测推送：不查航班，直接推一条 Bark 到手机'
        type: boolean
        default: false
      loop_minutes:
        description: '循环多少分钟（0 = 只查一轮就退出，调试用）'
        type: string
        default: '0'
      round_sec:
        description: '多少秒查一轮（留空 = 白天 300 / 夜里 900）。开卖当天手动长跑建议 120'
        type: string
        default: ''
      relay:
        description: '跑完自动接力再起一次（一直接到行程最后一天；Cancel 这次 run 就断）'
        type: boolean
        default: false

# 定时那条排队接力；手动触发单独一组，不用排在 50 分钟的循环后面等着。
concurrency:
  group: vs-watch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 比 VS_LOOP_MINUTES 多留 5 分钟：脚本自己会在 35 分钟处收尾，
    # 这里是万一它收不了尾时的硬上限。调大 VS_LOOP_MINUTES 时记得一起调这个。
    #
    # 2026-09-27 加：手动触发放到 GitHub 托管 runner 的单 job 上限 360 分钟（6 小时，官方文档）。
    # 定时触发实测已稀到 3-5 小时一次，开卖当天靠手动长跑盯：
    #   loop_minutes=350、round_sec=120。留 10 分钟给 checkout 和最后一轮收尾。
    #   表达式不支持加法，所以按事件类型二选一。
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 40 }}
    steps:
      - uses: actions/checkout@v4
      - name: 查
        shell: pwsh
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          VS_TEST_PUSH: ${{ inputs.test_push }}
          VS_LOOP_MINUTES: ${{ inputs.loop_minutes || 35 }}
          VS_ROUND_EVERY_SEC: ${{ inputs.round_sec || 300 }}   # 格鲁吉亚白天（UTC 05-15）：5 分钟一轮
          VS_ROUND_NIGHT_SEC: ${{ inputs.round_sec || 900 }}   # 其余时段：15 分钟一轮
          VS_PUSH_COOLDOWN_MIN: 15    # 同一条腿 15 分钟内不重复推，免得把 Bark 吵到被静音
          # 手动长跑每 60 分钟给主账号推一条心跳（本趟第一轮后先推一条）；定时触发不推
          VS_HEARTBEAT_MIN: ${{ github.event_name == 'workflow_dispatch' && 60 || 0 }}
        run: ./watch-once.ps1

  # ------------------------------------------------------------------------------
  # 2026-09-27 加：接力。手动长跑单次最多 6 小时，跑完由这个 job 再触发一次同样参数的 run。
  # ------------------------------------------------------------------------------
  #   · GITHUB_TOKEN 触发的 workflow_dispatch 会产生新 run（官方文档写明的例外），
  #     所以不需要额外的 PAT，只要给这个 job actions: write。
  #   · 新 run 和本 run 同在 vs-watch-workflow_dispatch 这个 concurrency 组，
  #     会排队到本 run 结束后立刻开跑，前后几乎无缝。
  #   · 怎么停：在 Actions 页面 Cancel 正在跑的那次（watch 结果是 cancelled 就不接）；
  #     或仓库变量 VS_RELAY 设成 off；或 Disable workflow。过了行程最后一天也自动不接。
  #   · 只在 watch 成功时接：脚本出错反复秒退时，接力会变成每分钟起一次的死循环。
  #     同理 loop_minutes 太短（调试用的 0）也不接。
  relay:
    needs: watch
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.relay
      && needs.watch.result == 'success' && vars.VS_RELAY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 接力
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          LOOP: ${{ inputs.loop_minutes }}
          ROUND: ${{ inputs.round_sec }}
          TRIP_LAST: '2026-10-05'     # 跟 watch-once.ps1 的 $TripLastDate 保持一致
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "$TRIP_LAST" ]]; then
            echo "已过行程最后一天（$TRIP_LAST），不再接力。记得去 Disable workflow。"
            exit 0
          fi
          if ! [[ "$LOOP" =~ ^[0-9]+$ ]] || (( LOOP < 30 )); then
            echo "loop_minutes=$LOOP 太短，不接力（防止秒退死循环）。"
            exit 0
          fi
          gh workflow run vanillasky-watch.yml --ref "$REF" \
            -f loop_minutes="$LOOP" -f round_sec="$ROUND" -f relay=true
          echo "已接力：新 run 会在本次结束后接着跑 $LOOP 分钟。"
