name: Vanilla Sky 放票监测

# 云端是兜底，不是主力 —— 主力是本机那份（常态 150 秒一轮，外加一个每 10 分钟
# 检查一次的看门狗）。这里只负责「家里断电断网、电脑关机时别全盘错过」。
#
# ------------------------------------------------------------------------------
# 2026-08-23 重做：密度交给 job 自己控制，cron 只负责把 job 拉起来
# ------------------------------------------------------------------------------
# 原来的设计是「查一轮就退出」，靠 cron 控制密度：
#     密档 */15 5-15（格鲁吉亚白天）+ 疏档每小时 = 57 次/天
#
# 实测根本没兑现。查了 8/21-8/23 的全部 run：
#     8/22 触发 19 次，8/23 到傍晚 8 次，密档那条 */15 被整条压成约一小时一次，
#     最大空档 224 分钟（8/23 00:00-03:31 UTC 什么都没跑）。
# 这是 GitHub 对 public repo 的 schedule 的既有行为：best-effort，
# 高频 cron 会被直接丢弃。**不能指望 cron 给你 15 分钟一次。**
#
# 所以现在：
#   · cron 写成 */15 * * * *，只是尽量多给 GitHub 几次「可以拉起我」的机会；
#     它实际会给多少次不重要，能给到就行。
#   · 真正的密度由 watch-once.ps1 在 job 内部循环控制 ——
#     一次触发跑 20 分钟，格鲁吉亚白天每 5 分钟查一轮、夜里每 15 分钟一轮。
#     实测一轮约 60 秒，所以白天一次触发大概查 3-4 轮。
#   · concurrency 用 cancel-in-progress: false：跑着的时候新触发排队而不是打断，
#     上一次跑完排队那次立刻接上。
#     （GitHub 只保留一个 pending，多余的自动作废，不会堆积。）
#
# 【为什么是 20 分钟而不是 50】
#   这是刻意留的余量，不是省额度 —— public repo 的 Actions 分钟数本来不限量。
#   50 分钟等于每小时占着 runner 五十分钟，为一个兜底占这么多不合适。
#   20 分钟的覆盖率大约是每小时里有一段 20 分钟的密集检查（约三分之一），
#   仍然远好过改之前的「一小时查一轮」。
#
#   云端本来就只是兜底 —— 主力是本机那份，现在有看门狗盯着，可靠性已经不一样了。
#   哪天真需要更密（比如临近开卖窗口、或者人要出门几天电脑关机），
#   把下面的 VS_LOOP_MINUTES 调大即可，50 是这个方案的上限（配 timeout-minutes: 55）。

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:              # 手动触发，用来做验证
    inputs:
      test_push:
        description: '只测推送：不查航班，直接推一条 Bark 到手机'
        type: boolean
        default: false
      loop_minutes:
        description: '循环多少分钟（0 = 只查一轮就退出，调试用）'
        type: string
        default: '0'

# 定时那条排队接力；手动触发单独一组，不用排在 50 分钟的循环后面等着。
concurrency:
  group: vs-watch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 比 VS_LOOP_MINUTES 多留 5 分钟：脚本自己会在 20 分钟处收尾，
    # 这里是万一它收不了尾时的硬上限。调大 VS_LOOP_MINUTES 时记得一起调这个。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 查
        shell: pwsh
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          VS_TEST_PUSH: ${{ inputs.test_push }}
          VS_LOOP_MINUTES: ${{ inputs.loop_minutes || 20 }}
          VS_ROUND_EVERY_SEC: 300     # 格鲁吉亚白天（UTC 05-15）：5 分钟一轮
          VS_ROUND_NIGHT_SEC: 900     # 其余时段：15 分钟一轮
          VS_PUSH_COOLDOWN_MIN: 15    # 同一条腿 15 分钟内不重复推，免得把 Bark 吵到被静音
        run: ./watch-once.ps1
