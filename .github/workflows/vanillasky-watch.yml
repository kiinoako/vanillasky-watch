name: Vanilla Sky 放票监测

# 云端是兜底，不是主力 —— 主力是本机那份（常态 150 秒、高警戒 45 秒一轮）。
# 这里只负责「家里断电断网、电脑关机时别全盘错过」，所以节奏按风险分档，
# 而不是一律每 5 分钟。这样对航空公司的站点也客气些。
#
#   格鲁吉亚时间 UTC+4。排班上架这种事只会发生在当地上班时间，
#   所以密的那一档就压在当地 09:00-20:00 ＝ UTC 05:00-15:59。
#
#   密档  每 15 分钟   UTC 05-15   （当地上班时间，事情只会在这时候发生）  44 次/天
#   疏档  每小时一次   UTC 16-04   （当地下班和夜里，纯粹是别断了）        13 次/天
#                                                                    ------------
#                                                                     57 次/天
#   原来一律 */5 是 288 次/天，砍掉了八成。
#
# 补充两句：公开仓库的 Actions 分钟数本来就是不限量的，这么改不是为了省额度，
# 是因为兜底没必要跑得比主力还勤。真要改成私有仓库，就把密档也调成每小时，
# 一天 24 次约 1000 分钟/月，正好落在私有仓库 2000 分钟的免费额度里。

on:
  schedule:
    - cron: '*/15 5-15 * * *'     # 格鲁吉亚白天：每 15 分钟
    - cron: '0 16-23,0-4 * * *'   # 其余时段：每小时
  workflow_dispatch:              # 手动触发，用来做验证
    inputs:
      test_push:
        description: '只测推送：不查航班，直接推一条 Bark 到手机'
        type: boolean
        default: false

# 上一轮还没跑完就跳过这一轮，避免堆积
concurrency:
  group: vs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 查一轮
        shell: pwsh
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          VS_TEST_PUSH: ${{ inputs.test_push }}
        run: ./watch-once.ps1
